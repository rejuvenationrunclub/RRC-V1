[project]
name = "rrc-bot"
version = "0.1.0"
description = "Rejuvenation Run Club Discord bot: lifetime RP, ranks, Hot Streaks and recognition."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "discord.py>=2.4,<3",
    "SQLAlchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "python-dotenv>=1.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
rrc-bot = "rrc_bot.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rrc_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "DTZ", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S607"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rrc_bot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a PostgreSQL database (TEST_DATABASE_URL)",
]
